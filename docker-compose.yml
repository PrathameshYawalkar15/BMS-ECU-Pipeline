services:
  bms-agent-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bms_ecu_agent_pipeline
    env_file:
      - path: .env
        required: false
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - PYTHONPATH=/app
    volumes:
      # Mount tests/, reports/, and verification_state.json to persist artifacts & SUP.10 snapshots on host
      - ./tests:/app/tests
      - ./reports:/app/reports
      - ./verification_state.json:/app/verification_state.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"