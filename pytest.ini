[pytest]
# --- ASPICE Traceability & Test Discovery Configuration ---
minversion = 6.0
addopts = -v --tb=short --strict-markers
testpaths = tests

# --- Custom Markers for ASPICE SWE.3 / SWE.4 Compliance ---
markers =
    requirement: Track system requirement ID mapping (e.g., REQ_BMS_001 for ISO 26262 / ASPICE)
    safety_critical: Mark tests associated with ASIL-rated safety goals (e.g., overvoltage, thermal runaway)
    unit: Low-level unit verification tests
    integration: High-level component or hardware-in-the-loop integration tests

# --- Filter Warnings to Keep Audit Logs Clean ---
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning